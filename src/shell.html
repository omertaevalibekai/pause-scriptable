text-align:center;padding:25px 8px;color:var(--muted);font-size:14px}.empty svg{width:36px;height:36px;margin-bottom:12px}.row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row .details{flex:1}.row strong{display:block;font-size:14px}.row small{display:block;color:var(--muted);margin-top:5px;font-size:12px}.dot{width:10px;height:10px;border-radius:50%;background:#e2937e}.dot.cigarette{background:var(--purple)}.day-heading{margin:26px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}.day-heading h2{font-size:16px}.badge{font-size:11px;border-radius:20px;padding:5px 9px;background:#f1f0ed;color:var(--muted)}.badge.complete{color:var(--green);background:#eaf1ed}.field{display:block;margin:18px 0}.field>span,.field>label{display:block;font-size:13px;font-weight:600;margin-bottom:8px}input,select,textarea{width:100%;min-height:48px;border:1px solid #dedbd7;border-radius:12px;padding:12px;background:var(--surface);color:var(--ink)}textarea{min-height:140px;resize:vertical;font-family:ui-monospace,monospace;font-size:12px}.field small{display:block;color:var(--muted);margin-top:7px;font-size:12px}.choices{display:flex;gap:8px;flex-wrap:wrap}.choice{border:1px solid #e6e1dd;border-radius:15px;padding:12px 14px;min-height:48px;display:flex;align-items:center;gap:7px;font-size:14px}.choice.selected{border-color:var(--coral);background:var(--peach);color:#95452f}.choice svg{width:20px;height:20px}.split{display:flex;gap:12px}.split>*{flex:1;min-width:0}.hint{font-size:13px;color:var(--muted);margin-top:12px}.divider{height:1px;background:var(--line);margin:20px 0}.section-label{margin:24px 2px 14px;font-size:17px}.support-link{color:#815140}.modal-backdrop{position:fixed;inset:0;background:#211b2345;z-index:10;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}.modal{position:relative;background:var(--paper);width:100%;max-width:480px;max-height:9
